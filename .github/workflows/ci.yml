name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-14
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install release package from checkout
        run: python -m pip install .
      - name: Show host and compiler
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          clang --version
      - name: Native runner must be ARM64
        if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64'"
      - name: Unit, source, model and applicable native checks
        run: python -m unittest discover -s tests -v
      - name: Installed CLI recovery and inverse program
        run: |
          rewynth recover --example --function _kernel_avalanche --arguments 1 > forward.json
          rewynth derive_inverse --example --function _kernel_avalanche --arguments 1 > inverse.json
          python -c "import json; f=json.load(open('forward.json')); i=json.load(open('inverse.json')); assert f['reconstruction']['status']=='verified_model'; assert i['inverse_program']['status']=='verified_inverse_model'; print('Installed recovery and inverse program passed')"
      - name: Installed 64-bit recovery, reusable inverse and exact words
        run: |
          rewynth recover --example-wide --function _splitmix64_step --arguments 1 --word-bits 64 > wide-forward.json
          rewynth derive_inverse --example-wide --function _splitmix64_step --arguments 1 --word-bits 64 > wide-inverse.json
          rewynth evaluate --example-wide --function _splitmix64_step --arguments 1 --word-bits 64 --inputs 0x123456789abcdef0 > wide-evaluate.json
          python -c "import json; f=json.load(open('wide-forward.json')); i=json.load(open('wide-inverse.json')); e=json.load(open('wide-evaluate.json')); assert f['reconstruction']['status']=='verified_model'; assert i['inverse_program']['status']=='verified_inverse_model'; assert e['witness']['output_u64']=='0x161922c645ce50e8'; print('Installed 64-bit recovery, inverse and exact evaluation passed')"
      - name: Installed conditional recovery and trace
        run: |
          rewynth recover --example-branches --function _tone_curve32 --arguments 1 > branches.json
          rewynth evaluate --example-branches --function _tone_curve32 --arguments 1 --inputs 4096 > branch-trace.json
          python -c "import json; f=json.load(open('branches.json')); e=json.load(open('branch-trace.json')); assert f['reconstruction']['status']=='verified_model'; assert e['witness']['output_u32']==4095; assert e['witness']['trace'][-1]['kind']=='return'; print('Installed conditional recovery and trace passed')"
      - name: Runnable conditional lesson against the installed package
        run: python examples/conditional_lab.py --output branch-lab
