<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Rewynth: the return hides a lost state update</title>
<desc id="desc">The original ARM64 instruction model and edited transition return 0xafeddd80. Their first state word differs. The next call of the original model yields 0x7d367e8e from the original post-state and 0xafeddd80 from the edited post-state. Generated pure C independently reproduces this result.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182039}.muted{fill:#4d5e7b}.mono{font-family:"Courier New",Courier,monospace}.blue{fill:#2458ba}.red{fill:#9c2e43}</style>
<rect width="1200" height="860" fill="#f3f5f8"/>
<text x="44" y="50" font-size="29" font-weight="700" class="">rewynth</text>
<text x="44" y="118" font-size="50" font-weight="700" class="">The return hides the lost update.</text>
<text x="44" y="166" font-size="18" font-weight="400" class="muted">An actual bounded ARM64 comparison.</text>
<text x="44" y="220" font-size="18" font-weight="400" class="muted">Initial memory[0] / state</text>
<text x="44" y="255" font-size="24" font-weight="400" class="mono">0x2fedd67bd8000000</text>
<text x="625" y="220" font-size="18" font-weight="400" class="muted">Initial memory[1] / increment</text>
<text x="625" y="255" font-size="24" font-weight="400" class="mono">0xcc7d05711fffffff</text>
<path d="M44 300H574" stroke="#aab8ce"/>
<text x="44" y="344" font-size="30" font-weight="700" class="blue">Recovered transition</text>
<text x="44" y="394" font-size="19" font-weight="400" class="muted">Immediate return, equal</text>
<text x="44" y="435" font-size="27" font-weight="400" class="mono">0x00000000afeddd80</text>
<text x="44" y="493" font-size="19" font-weight="400" class="muted">Post-state memory[0], different</text>
<text x="44" y="534" font-size="27" font-weight="400" class="mono">0xc8e7e15e17ffffff</text>
<path d="M64 558V604m-6-7 6 7 6-7" fill="none" stroke="#4d5e7b" stroke-width="2"/>
<text x="44" y="644" font-size="19" font-weight="400" class="muted">Next call of the original model</text>
<text x="44" y="685" font-size="27" font-weight="400" class="mono">0x000000007d367e8e</text>
<path d="M624 300H1154" stroke="#aab8ce"/>
<text x="624" y="344" font-size="30" font-weight="700" class="red">Lost-store edit</text>
<text x="624" y="394" font-size="19" font-weight="400" class="muted">Immediate return, equal</text>
<text x="624" y="435" font-size="27" font-weight="400" class="mono">0x00000000afeddd80</text>
<text x="624" y="493" font-size="19" font-weight="400" class="muted">Post-state memory[0], different</text>
<text x="624" y="534" font-size="27" font-weight="400" class="mono">0x2fedd67bd8000000</text>
<path d="M644 558V604m-6-7 6 7 6-7" fill="none" stroke="#4d5e7b" stroke-width="2"/>
<text x="624" y="644" font-size="19" font-weight="400" class="muted">Next call of the original model</text>
<text x="624" y="685" font-size="27" font-weight="400" class="mono">0x00000000afeddd80</text>
<text x="44" y="755" font-size="21" font-weight="700" class="blue">memory[1] is retained in both. Generated pure C reproduces both continuations.</text>
<text x="44" y="802" font-size="18" font-weight="400" class="muted">Logical uint64 inputs and returned state; original pointer ABI and target execution are outside this check.</text>
<text x="44" y="838" font-size="17" font-weight="400" class="muted">One declared pointer, two words, one fixed synthetic base. Equality remains conditional on the implemented model.</text>
</svg>
