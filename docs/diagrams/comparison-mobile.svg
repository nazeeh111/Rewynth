<svg xmlns="http://www.w3.org/2000/svg" id="comparison-mobile" viewBox="0 0 420 956" role="img" aria-labelledby="comparison-mobile-title comparison-mobile-desc">
<title id="comparison-mobile-title">What an edit comparison establishes</title>
<desc id="comparison-mobile-desc">The original instruction model, edited source and declared input domain determine whether the solver finds a counterexample, proves no mismatch within that scope, or remains undecided.</desc>
<defs><marker id="comparison-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#687264" stroke-width="1.5" /></marker></defs>
<rect width="420" height="956" fill="#f5f3ee" />
<text x="20" y="40" text-anchor="start" fill="#ac481b" font-family="ui-monospace, monospace" font-size="13" font-weight="500"><tspan x="20" dy="0">REWYNTH / MODEL COMPARISON</tspan></text>
<text x="20" y="80" text-anchor="start" fill="#242823" font-family="Georgia, serif" font-size="31" font-weight="400"><tspan x="20" dy="0">Compare an edit.</tspan><tspan x="20" dy="36">Keep the scope.</tspan></text>
<text x="20" y="144" text-anchor="start" fill="#60675c" font-family="system-ui, sans-serif" font-size="18" font-weight="400"><tspan x="20" dy="0">Three inputs. One bounded question.</tspan></text>
<path d="M72 280 V304 Q72 312 80 312 H114 Q122 312 122 320 V372" fill="none" stroke="#687264" stroke-width="2" marker-end="url(#comparison-mobile-arrow)" />
<path d="M210 280 V332" fill="none" stroke="#687264" stroke-width="2" marker-end="url(#comparison-mobile-arrow)" />
<path d="M348 280 V304 Q348 312 340 312 H306 Q298 312 298 320 V372" fill="none" stroke="#687264" stroke-width="2" marker-end="url(#comparison-mobile-arrow)" />
<path d="M122 452 V528 Q122 536 114 536 H80 Q72 536 72 544 V588" fill="none" stroke="#687264" stroke-width="2" marker-end="url(#comparison-mobile-arrow)" />
<path d="M210 492 V588" fill="none" stroke="#687264" stroke-width="2" marker-end="url(#comparison-mobile-arrow)" />
<path d="M298 452 V528 Q298 536 306 536 H340 Q348 536 348 544 V588" fill="none" stroke="#687264" stroke-width="2" marker-end="url(#comparison-mobile-arrow)" />
<rect x="59.5" y="500" width="49" height="28" fill="#f5f3ee" /><text x="84" y="520" text-anchor="middle" fill="#60675c" font-family="ui-monospace, monospace" font-size="18" font-weight="500"><tspan x="84" dy="0">SAT</tspan></text>
<rect x="218.5" y="548" width="71" height="28" fill="#f5f3ee" /><text x="254" y="568" text-anchor="middle" fill="#60675c" font-family="ui-monospace, monospace" font-size="18" font-weight="500"><tspan x="254" dy="0">UNSAT</tspan></text>
<rect x="307.5" y="488" width="93" height="28" fill="#f5f3ee" /><text x="354" y="508" text-anchor="middle" fill="#60675c" font-family="ui-monospace, monospace" font-size="18" font-weight="500"><tspan x="354" dy="0">UNKNOWN</tspan></text>
<rect x="16" y="176" width="112" height="104" rx="6" fill="#fbfbf7" stroke="#687264" stroke-width="1.5" />
<text x="72" y="207" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="20" font-weight="600"><tspan x="72" dy="0">Original</tspan><tspan x="72" dy="25">model</tspan></text>
<text x="72" y="262" text-anchor="middle" fill="#60675c" font-family="ui-monospace, monospace" font-size="18" font-weight="400"><tspan x="72" dy="0">f(x)</tspan></text>
<rect x="154" y="176" width="112" height="104" rx="6" fill="#fbfbf7" stroke="#687264" stroke-width="1.5" />
<text x="210" y="207" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="20" font-weight="600"><tspan x="210" dy="0">Edited</tspan><tspan x="210" dy="25">source</tspan></text>
<text x="210" y="262" text-anchor="middle" fill="#60675c" font-family="ui-monospace, monospace" font-size="18" font-weight="400"><tspan x="210" dy="0">g(x)</tspan></text>
<rect x="292" y="176" width="112" height="104" rx="6" fill="#fbfbf7" stroke="#687264" stroke-width="1.5" />
<text x="348" y="207" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="20" font-weight="600"><tspan x="348" dy="0">Allowed</tspan><tspan x="348" dy="25">inputs</tspan></text>
<text x="348" y="262" text-anchor="middle" fill="#60675c" font-family="ui-monospace, monospace" font-size="18" font-weight="400"><tspan x="348" dy="0">x in D</tspan></text>
<path d="M210 332 L386 412 L210 492 L34 412 Z" fill="#f5e8dc" stroke="#ac481b" stroke-width="2" />
<text x="210" y="389" text-anchor="middle" fill="#ac481b" font-family="ui-monospace, monospace" font-size="13" font-weight="500"><tspan x="210" dy="0">SOLVER QUESTION</tspan></text>
<text x="210" y="411" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="18" font-weight="600"><tspan x="210" dy="0">Can the edit change output</tspan><tspan x="210" dy="25">for an allowed input?</tspan></text>
<rect x="16" y="588" width="112" height="216" rx="20" fill="#fbfbf7" stroke="#687264" stroke-width="1.5" />
<text x="72" y="622" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="18" font-weight="600"><tspan x="72" dy="0">Mismatch</tspan></text>
<text x="72" y="688" text-anchor="middle" fill="#60675c" font-family="system-ui, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">An input</tspan><tspan x="72" dy="25">makes the</tspan><tspan x="72" dy="25">outputs</tspan><tspan x="72" dy="25">differ.</tspan></text>
<rect x="154" y="588" width="112" height="216" rx="20" fill="#fbfbf7" stroke="#687264" stroke-width="1.5" />
<text x="210" y="622" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="18" font-weight="600"><tspan x="210" dy="0">Scoped</tspan><tspan x="210" dy="23">equality</tspan></text>
<text x="210" y="688" text-anchor="middle" fill="#60675c" font-family="system-ui, sans-serif" font-size="17" font-weight="400"><tspan x="210" dy="0">Within this</tspan><tspan x="210" dy="25">model and</tspan><tspan x="210" dy="25">input range.</tspan></text>
<rect x="292" y="588" width="112" height="216" rx="20" fill="#fbfbf7" stroke="#687264" stroke-width="1.5" />
<text x="348" y="622" text-anchor="middle" fill="#242823" font-family="system-ui, sans-serif" font-size="18" font-weight="600"><tspan x="348" dy="0">Undecided</tspan></text>
<text x="348" y="688" text-anchor="middle" fill="#60675c" font-family="system-ui, sans-serif" font-size="17" font-weight="400"><tspan x="348" dy="0">No equality</tspan><tspan x="348" dy="25">conclusion.</tspan><tspan x="348" dy="25">Timeouts</tspan><tspan x="348" dy="25">stay unknown.</tspan></text>
<text x="20" y="848" text-anchor="start" fill="#60675c" font-family="system-ui, sans-serif" font-size="18" font-weight="400"><tspan x="20" dy="0">For a mismatch, inspect the input,</tspan><tspan x="20" dy="25">both outputs and its model trace.</tspan></text>
<text x="20" y="912" text-anchor="start" fill="#60675c" font-family="system-ui, sans-serif" font-size="17" font-weight="400"><tspan x="20" dy="0">Unsupported code is refused first.</tspan><tspan x="20" dy="25">UNSAT does not certify the CPU or lifter.</tspan></text>
</svg>
